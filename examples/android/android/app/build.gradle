// Derived from Community template 0.88.0; see ../../THIRD_PARTY_NOTICES.md.
apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    nodeExecutableAndArgs = [System.getenv("NODE_BINARY") ?: "node"]
    debuggableVariants = [] // Bundle debug assets; no Metro runtime required.
    autolinkLibrariesWithApp()
}
def keyPath = System.getenv("BOOPSTICK_ANDROID_KEYSTORE")
def ndkRoot = System.getenv("BOOPSTICK_ANDROID_NDK")
if (!keyPath || !ndkRoot) throw new GradleException("Set BOOPSTICK_ANDROID_KEYSTORE and BOOPSTICK_ANDROID_NDK")
android {
    ndkVersion rootProject.ext.ndkVersion
    ndkPath ndkRoot
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace "org.boopstick.specimen"
    defaultConfig {
        applicationId "org.boopstick.specimen"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.0.0-diagnostic"
    }
    signingConfigs {
        debug {
            storeFile file(keyPath)
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.debug } }
}
dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
}
