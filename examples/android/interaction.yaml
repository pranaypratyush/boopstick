appId: org.boopstick.specimen
---
# Host force-stops and launches the fresh capture URL before this flow.
# Every actual mode renders both subjects; the toggle action applies the variant.
- launchApp:
    stopApp: false
    clearState: false
    permissions: {}
- assertVisible:
    id: mode-label
    text: 'Mode: ${MODE}'
- assertVisible:
    id: state-label
    text: 'State: off'
- assertVisible:
    id: body-subject
- assertVisible:
    id: action-subject
- takeScreenshot: ${SCREENSHOT}-before
- tapOn:
    id: toggle-button
- assertVisible:
    id: state-label
    text: 'State: on'
- assertVisible:
    id: body-subject
- assertVisible:
    id: action-subject
- assertVisible:
    id: capture-status
    text: 'Capture: ready'
- assertVisible:
    id: capture-button
- tapOn:
    id: capture-button
- assertVisible:
    id: capture-status
    text: 'Capture: exported'
- takeScreenshot: ${SCREENSHOT}
